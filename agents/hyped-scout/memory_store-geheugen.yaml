name: hyped-geheugen
description: >-
  Langetermijngeheugen van de Hyped Scout: instellingen (Discord-ID's), de lijst
  met bronkanalen en hun risicoklasse, de voorkeuren van de eigenaar, welke
  bronvideo's al geclipt of voorgesteld zijn, en een logboek per ronde.
  Lees dit aan het begin van elke ronde en werk het aan het eind bij.
