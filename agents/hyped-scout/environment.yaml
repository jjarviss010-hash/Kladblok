# Sandbox voor de Scout. Alleen YouTube en Discord zijn bereikbaar:
# dat is de veiligheidsgrens, omdat bash zonder goedkeuring mag draaien
# (een geplande run heeft niemand die "ja" kan klikken).
name: hyped-scout
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: false
    allow_mcp_servers: false
    allowed_hosts:
      - www.googleapis.com
      - youtube.googleapis.com
      - discord.com
