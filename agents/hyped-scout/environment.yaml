# Sandbox voor de Hyped-agent. Alleen de YouTube Data API is bereikbaar:
# dat is de veiligheidsgrens, omdat bash zonder goedkeuring mag draaien.
# Discord loopt via de bot (bot/), niet via de agent.
name: hyped-scout
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: false
    allow_mcp_servers: false
    allowed_hosts:
      - www.googleapis.com
      - youtube.googleapis.com
